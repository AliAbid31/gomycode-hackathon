[project]
name = "brandforge-ai"
version = "1.0.0"
description = "AI-Powered Brand Growth & Marketing Automation Platform"
requires-python = ">=3.11"
dependencies = [
    "agno[google,duckduckgo,duckdb]>=2.0.0", "google-genai>=0.2.0",
    "openai>=1.40.0",
    "anthropic>=0.30.0",
    "lancedb>=0.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "crawl4ai>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "tantivy>=0.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]
full = ["fal-client>=0.4.0", "firecrawl-py>=1.0.0", "tavily-python>=0.4.0", "tweepy>=4.14.0", "replicate>=0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
